name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=C9A86A

      - name: Show generated file
        run: |
          ls -lh assets/github-contribution-grid-snake.svg
          head -c 200 assets/github-contribution-grid-snake.svg
          echo ""

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh contribution snake [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push || { git fetch origin && git rebase origin/main && git push; }
          fi

      - name: Health check
        if: always()
        run: |
          echo "=== commit log ==="
          git log --oneline -3
          echo ""
          echo "=== snake SVG check ==="
          if grep -q "</svg>" assets/github-contribution-grid-snake.svg; then
            echo "OK: snake SVG is valid"
          else
            echo "FAIL: snake SVG not closed"
          fi
