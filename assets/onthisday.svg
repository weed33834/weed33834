  <text x="100" y="78" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#F5E6C8"><tspan x="100" dy="0.0">First Fitna: In the Battle of Siffin, troops led by Ali</tspan><tspan x="100" dy="16.9">ibn Abu Talib clash with those led by Muawiyah I.</tspan></text>
  <text x="40" y="127.80000000000001" font-family="JetBrains Mono, monospace" font-size="15" fill="#C9A86A" font-weight="500">811</text>
  <text x="100" y="127.80000000000001" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#F5E6C8"><tspan x="100" dy="0.0">Battle of Pliska: Byzantine Emperor Nikephoros I is</tspan><tspan x="100" dy="16.9">killed and his heir Staurakios is seriously wounded.</tspan></text>
  <text x="40" y="177.60000000000002" font-family="JetBrains Mono, monospace" font-size="15" fill="#C9A86A" font-weight="500">920</text>
  <text x="100" y="177.60000000000002" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#F5E6C8"><tspan x="100" dy="0.0">Rout of an alliance of Christian troops from Navarre and</tspan><tspan x="100" dy="16.9">Léon against the Muslims at the Battle of</tspan><tspan x="100" dy="16.9">Valdejunquera.</tspan></text>
  
