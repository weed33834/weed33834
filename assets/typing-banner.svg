<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="auto">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#131a3f"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes fadeIn { from {opacity:0} to {opacity:1} }
      .caret { animation: blink 1s step-end infinite; }
      .words { animation: fadeIn 1s ease-out; }
    </style>
  </defs>
  <rect width="1200" height="120" fill="url(#tb)" rx="10"/>
  <rect x="6" y="6" width="1188" height="108" fill="none" stroke="#C9A86A" stroke-width="0.6" stroke-opacity="0.4" rx="8"/>
  <text x="120" y="72.0" font-family="JetBrains Mono, monospace" font-size="34" fill="#8B92A8" letter-spacing="1">$&gt;</text>
  <text class="words" x="200" y="72.0" font-family="JetBrains Mono, monospace" font-size="34" fill="#F5E6C8" letter-spacing="1">I craft <tspan fill="#C9A86A">interfaces</tspan> · tools · experiences</text>
  <text class="caret" x="200" y="72.0" font-family="JetBrains Mono, monospace" font-size="34" fill="#C9A86A">▍</text>
  <text x="200" y="100.0" font-family="Georgia, 'Noto Serif SC', serif" font-size="15" fill="#5a6280" letter-spacing="2">夜观星象 · 以代码作舟  |  RATHER THAN BETTER, DIFFERENT</text>
</svg>